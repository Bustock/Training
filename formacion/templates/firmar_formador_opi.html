{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRMA DEL FORMADOR - OPI</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body {
            text-align: center;
            background-color: #f5f7fa;
            background-image: url("{% static 'fondo_esquina.png' %}");
            background-size: 200px 60px;
            background-repeat: no-repeat;
            background-position: 10px 10px;
            background-attachment: fixed;
        }
        form, h1 {
            background-color: rgb(0, 132, 203);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        label, h1 {
            font-size: 25px;
            color: rgb(255, 255, 255);
        }
        .message {
            color: rgba(63, 72, 204, 0.829);
        }
        h3 {
            color: rgb(255, 255, 255);
        }
        #signature-pad {
            border: 1px solid #000;
            width: 600px;
            height: 300px;
            background-color: #ffffff;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <form method="post" action="{% url 'firmar_formador_opi' %}" enctype="multipart/form-data" id="firma-form">
            <p class="message"><strong><h2>FIRMA DEL FORMADOR DE LA OPI</h2></strong></p>
            <p><strong>OPI:</strong> {{ opi }}</p>

            {% csrf_token %}
            <input type="hidden" name="opi" value="{{ opi }}">

            <label for="formador"><strong>Nombre del formador:</strong></label>
            <input type="text" id="formador" name="formador" value="{{ formador }}" required><br><br>

            <label for="firma">Firma:</label><br>
            <canvas id="signature-pad"></canvas><br>
            <button type="button" id="clear">Limpiar</button>

            <input type="hidden" id="imagen" name="imagen">
            <button type="submit" id="guardar">Guardar</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var canvas = document.getElementById('signature-pad');
            var signaturePad = new SignaturePad(canvas);
            var clearButton = document.getElementById('clear');
            var guardarButton = document.getElementById('guardar');
            var imagenInput = document.getElementById('imagen');

            function resizeCanvas() {
                var ratio = Math.max(window.devicePixelRatio || 1, 1);
                var data = signaturePad.toData();
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                canvas.getContext("2d").scale(ratio, ratio);
                signaturePad.clear();
                signaturePad.fromData(data);
            }

            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            clearButton.addEventListener('click', function() {
                signaturePad.clear();
            });

            guardarButton.addEventListener('click', function(event) {
                if (signaturePad.isEmpty()) {
                    alert("Por favor, dibuja tu firma.");
                    event.preventDefault();
                } else {
                    imagenInput.value = signaturePad.toDataURL('image/png');
                }
            });
        });
    </script>

    <script>
        const tiempoInactividad = 15 * 60 * 1000;
        let temporizadorInactividad;

        function reiniciarTemporizador() {
            clearTimeout(temporizadorInactividad);
            temporizadorInactividad = setTimeout(cerrarSesionPorInactividad, tiempoInactividad);
        }

        function cerrarSesionPorInactividad() {
            fetch("{% url 'timeout' %}", {
                method: 'POST',
                headers: {'X-CSRFToken': '{{ csrf_token }}'}
            }).then(() => {
                window.location.href = "{% url 'timeout' %}";
            });
        }

        document.addEventListener("mousemove", reiniciarTemporizador);
        document.addEventListener("keydown", reiniciarTemporizador);
        document.addEventListener("click", reiniciarTemporizador);

        reiniciarTemporizador();
    </script>
</body>
</html>
